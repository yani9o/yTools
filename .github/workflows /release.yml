name: Release after commit

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Package addon
        env:
          ADDON_NAME: ${{ github.event.repository.name }}
        run: |
          git archive --format=zip \
            --prefix="$ADDON_NAME/" \
            --output="$RUNNER_TEMP/$ADDON_NAME.zip" HEAD

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ADDON_NAME: ${{ github.event.repository.name }}
        run: |
          RELEASE_TITLE="$(git log -1 --format=%s)"

          gh release create \
            "build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}" \
            "$RUNNER_TEMP/$ADDON_NAME.zip" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TITLE" \
            --notes "Automatic release for commit $GITHUB_SHA." \
            --latest
